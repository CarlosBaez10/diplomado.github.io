<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de Imágenes</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="index.html">Mi Galería</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Sobre Nosotros</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        <div id="image-details">
            <img id="detailed-image" src="" alt="">
            <h2 id="image-title"></h2>
            <p id="image-description"></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Mi Galería de Imágenes</p>
    </footer>
    <script>

        const urlParams = new URLSearchParams(window.location.search);
        const imageUrl = urlParams.get('image');
        const imageTitle = urlParams.get('title');
        const imageDescription = urlParams.get('description');

        document.getElementById('detailed-image').src = imageUrl;
        document.getElementById('image-title').textContent = imageTitle;
        document.getElementById('image-description').textContent = imageDescription;
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
